<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6fbfa">
  <meta name="description" content="MOMO 英语岛：为英语初学者设计的分级词汇、音标、语法与生活口语学习应用。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOMO英语岛">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <title>MOMO 英语岛</title>
</head>
<body>
  <div class="ambient-shape ambient-one" aria-hidden="true"></div>
  <div class="ambient-shape ambient-two" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="app-header" id="appHeader">
      <button class="brand-button" data-go="home" aria-label="回到英语岛首页">
        <span class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 44 44">
            <path d="M9 18c0-7 6-11 13-11s13 4 13 11c0 6-4 10-7 12l-2 6-5-3h-2l-5 3-1-7c-3-2-4-6-4-11Z" fill="#fff8ec"/>
            <path d="M11 15 6 12c-1 5 1 9 5 10M33 15l5-3c1 5-1 9-5 10" fill="#fff8ec" stroke="#173b4d" stroke-width="2"/>
            <path d="M15 17c2-2 4-2 6 0M25 17c2-2 4-2 6 0" fill="none" stroke="#173b4d" stroke-width="2" stroke-linecap="round"/>
            <path d="m21 21 2 2 2-2M23 23v3M20 28c2 2 4 2 6 0" fill="none" stroke="#173b4d" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 35c4 4 14 4 18 0" fill="none" stroke="#ff735c" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <span><strong>MOMO</strong><small>英语岛</small></span>
      </button>
      <div class="header-actions">
        <span class="energy-pill" aria-label="学习能量">
          <span class="energy-spark">✦</span>
          <strong id="energyCount">0</strong>
        </span>
        <button class="icon-button" id="installButton" aria-label="安装到手机" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        </button>
        <button class="avatar-button" data-go="profile" aria-label="打开学习档案">M</button>
      </div>
    </header>

    <main id="screen" tabindex="-1"></main>
    <div class="safe-space" aria-hidden="true"></div>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="主要功能">
    <button class="nav-tab is-active" data-go="home">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5-1.5 8.5h-15z"/><path d="M9 20v-6h6v6"/></svg>
      </span>
      <small>小岛</small>
    </button>
    <button class="nav-tab" data-go="words">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H8a3 3 0 0 1-3-3z"/><path d="M8 4v13h11M11 8h5M11 11h4"/></svg>
      </span>
      <small>单词</small>
    </button>
    <button class="nav-tab" data-go="phonics">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l4 4V6L7 10z"/><path d="M15 9c2 2 2 4 0 6M18 6c4 4 4 8 0 12"/></svg>
      </span>
      <small>音标</small>
    </button>
    <button class="nav-tab" data-go="grammar">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 17V9l4-4 4 4v8M14 12h4l2 5H12z"/><path d="M7 11h4M17 15h1"/></svg>
      </span>
      <small>语法</small>
    </button>
    <button class="nav-tab" data-go="profile">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.2-6 7-6s6.2 2 7 6"/></svg>
      </span>
      <small>我的</small>
    </button>
  </nav>

  <div id="modalRoot"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">请开启 JavaScript 后使用 MOMO 英语岛。</div>
  </noscript>

  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
